# Les 5 médias de niche. Nom, @, couleur et phrase d'abonnement se changent aussi dans le site (Réglages).
# Ici : la ligne éditoriale et les sources (flux RSS) de chaque média.
# rubriques = les thèmes du média : l'IA varie les sujets entre eux au fil de la journée.
# weight = confiance dans la source ; aggregator = flux Google News (le vrai média est lu dans le titre).

common_blocked: ["black friday", "bon plan", "bons plans", "code promo", "promo ", "soldes", "meilleures offres",
                 "meilleur prix", "à quel prix", "test :", "comparatif", "quiz", "horoscope", "podcast", "replay",
                 "l'intégrale", "programme tv", "à quelle heure et sur quelle chaîne", "abonnez-vous", "newsletter",
                 "jeu concours", "recette", "tribune", "chronique", "édito"]

medias:
  - id: politique
    name: "BALLOTTAGE"
    handle: "@ballottage"
    color: "#2747D6"
    accent: "#FF4D4D"
    cta: "Abonne-toi pour suivre la politique sans prise de tête"
    niche: "la politique française : gouvernement, Assemblée et Sénat, présidentielle 2027, partis, sondages, grandes réformes"
    audience: "les 18-40 ans qui veulent comprendre la politique sans jargon"
    exclude: "faits divers sans enjeu politique, sport, people, météo, rappels de produits, économie pure sans décision politique"
    rubriques: ["gouvernement", "Assemblée et Sénat", "présidentielle 2027", "partis et personnalités", "sondages", "réformes et lois", "justice et institutions", "élections locales"]
    min_sources: 2
    feeds:
      - { name: "franceinfo", url: "https://www.francetvinfo.fr/politique.rss", weight: 1.3, trusted: true }
      - { name: "Le Figaro", url: "https://www.lefigaro.fr/rss/figaro_politique.xml", weight: 1.2, trusted: true }
      - { name: "Le Monde", url: "https://www.lemonde.fr/politique/rss_full.xml", weight: 1.3, trusted: true }
      - { name: "BFMTV", url: "https://www.bfmtv.com/rss/politique/", weight: 1.1 }
      - { name: "20 Minutes", url: "https://www.20minutes.fr/feeds/rss-politique.xml", weight: 1.0 }
      - { name: "Libération", url: "https://www.liberation.fr/arc/outboundfeeds/rss-all/category/politique/?outputType=xml", weight: 1.0 }
      - { name: "Google News", url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=fr&gl=FR&ceid=FR:fr", weight: 1.0, aggregator: true }

  - id: finance
    name: "LA FRAÎCHE"
    handle: "@lafraiche.fr"
    color: "#0E9F6E"
    accent: "#FFC83D"
    cta: "Abonne-toi pour comprendre où va ton argent"
    niche: "l'argent et l'économie du quotidien : pouvoir d'achat, prix, salaires, impôts, retraites, immobilier, épargne, bourse, grandes entreprises, crypto"
    audience: "les jeunes actifs qui veulent comprendre l'économie et gérer leur argent"
    exclude: "rappels de produits et alertes sanitaires, faits divers, accidents, météo, sport, people, politique sans impact sur l'argent des gens, tests et promos"
    rubriques: ["prix et pouvoir d'achat", "salaires et emploi", "impôts et taxes", "retraites", "logement et immobilier", "épargne et banque", "bourse et marchés", "grandes entreprises", "crypto"]
    min_sources: 2
    extra_blocked: ["good morning market", "combien vaut"]
    feeds:
      - { name: "franceinfo", url: "https://www.francetvinfo.fr/economie.rss", weight: 1.3, trusted: true }
      - { name: "Le Figaro", url: "https://www.lefigaro.fr/rss/figaro_economie.xml", weight: 1.2, trusted: true }
      - { name: "Le Monde", url: "https://www.lemonde.fr/economie/rss_full.xml", weight: 1.3, trusted: true }
      - { name: "BFM Business", url: "https://www.bfmtv.com/rss/economie/", weight: 1.1 }
      - { name: "La Tribune", url: "https://www.latribune.fr/rss/rubriques/actualite.html", weight: 1.0 }
      - { name: "20 Minutes", url: "https://www.20minutes.fr/feeds/rss-economie.xml", weight: 1.0 }
      - { name: "Google News", url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=fr&gl=FR&ceid=FR:fr", weight: 1.0, aggregator: true }

  - id: tech
    name: "CTRL"
    handle: "@ctrl.fr"
    color: "#7C3AED"
    accent: "#22D3EE"
    cta: "Abonne-toi pour suivre la tech et l'IA"
    niche: "la tech et l'intelligence artificielle : IA, géants du numérique, smartphones, réseaux sociaux, jeux vidéo, cybersécurité, espace"
    audience: "les curieux de tech et d'IA, sans être experts"
    exclude: "promos et bons plans, tests de produits, géopolitique et défense (sauf si la technologie est le cœur du sujet), sport, people, faits divers"
    rubriques: ["intelligence artificielle", "géants du numérique", "smartphones et objets", "réseaux sociaux", "jeux vidéo", "cybersécurité", "espace", "lois du numérique"]
    min_sources: 1
    hot_sources: 2
    extra_blocked: ["offre", "prix cassé", "réduction", "à moins de", "€ seulement", "promotion"]
    feeds:
      - { name: "Le Monde", url: "https://www.lemonde.fr/pixels/rss_full.xml", weight: 1.3, trusted: true }
      - { name: "Numerama", url: "https://www.numerama.com/feed/", weight: 1.2, trusted: true }
      - { name: "Frandroid", url: "https://www.frandroid.com/feed", weight: 1.0 }
      - { name: "01net", url: "https://www.01net.com/feed/", weight: 1.0 }
      - { name: "Les Numériques", url: "https://www.lesnumeriques.com/rss.xml", weight: 1.0 }
      - { name: "Clubic", url: "https://www.clubic.com/feed/news.rss", weight: 1.0 }
      - { name: "Journal du Geek", url: "https://www.journaldugeek.com/feed/", weight: 0.9 }
      - { name: "BFM Tech", url: "https://www.bfmtv.com/rss/tech/", weight: 1.0 }
      - { name: "Siècle Digital", url: "https://siecledigital.fr/feed/", weight: 1.0 }
      - { name: "Google News", url: "https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=fr&gl=FR&ceid=FR:fr", weight: 1.0, aggregator: true }

  - id: sport
    name: "PETIT PONT"
    handle: "@petitpont.fr"
    color: "#F26A1B"
    accent: "#FFE14D"
    cta: "Abonne-toi pour ne rien rater du sport"
    niche: "le sport : football (Ligue 1, équipe de France, Ligue des champions, mercato), NBA et Wembanyama, rugby, tennis, Formule 1, cyclisme, grands événements"
    audience: "les fans de sport, surtout de foot"
    exclude: "faits divers sans lien sportif, politique, économie (sauf grand transfert ou rachat de club), people hors sport"
    rubriques: ["Ligue 1", "équipe de France", "Ligue des champions", "mercato", "NBA et basket", "rugby", "tennis", "Formule 1", "cyclisme", "autres sports"]
    min_sources: 2
    feeds:
      - { name: "L'Équipe", url: "https://dwh.lequipe.fr/api/edito/rss?path=/", weight: 1.3, trusted: true }
      - { name: "RMC Sport", url: "https://rmcsport.bfmtv.com/rss/fil-sport/", weight: 1.2, trusted: true }
      - { name: "franceinfo", url: "https://www.francetvinfo.fr/sports.rss", weight: 1.1 }
      - { name: "Le Figaro", url: "https://www.lefigaro.fr/rss/figaro_sport.xml", weight: 1.0 }
      - { name: "20 Minutes", url: "https://www.20minutes.fr/feeds/rss-sport.xml", weight: 1.0 }
      - { name: "Foot Mercato", url: "https://www.footmercato.net/flux-rss", weight: 0.9 }
      - { name: "Google News", url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=fr&gl=FR&ceid=FR:fr", weight: 1.0, aggregator: true }

  - id: monde
    name: "FUSEAU HORAIRE"
    handle: "@fuseauhoraire"
    color: "#0284C7"
    accent: "#F43F5E"
    cta: "Abonne-toi pour comprendre le monde"
    niche: "l'international et la géopolitique : guerres et conflits, États-Unis, Europe, diplomatie, grandes crises, élections à l'étranger"
    audience: "ceux qui veulent comprendre ce qui se passe dans le monde"
    exclude: "sport (même international), tech et entreprises (sauf enjeu géopolitique majeur), people, faits divers isolés, actualité française intérieure"
    rubriques: ["Ukraine et Russie", "Proche-Orient", "États-Unis", "Europe", "Afrique", "Asie", "Amérique latine", "diplomatie", "élections à l'étranger", "crises humanitaires"]
    min_sources: 2
    feeds:
      - { name: "franceinfo", url: "https://www.francetvinfo.fr/monde.rss", weight: 1.3, trusted: true }
      - { name: "France 24", url: "https://www.france24.com/fr/rss", weight: 1.2, trusted: true }
      - { name: "RFI", url: "https://www.rfi.fr/fr/rss", weight: 1.2, trusted: true }
      - { name: "Le Figaro", url: "https://www.lefigaro.fr/rss/figaro_international.xml", weight: 1.1 }
      - { name: "Courrier international", url: "https://www.courrierinternational.com/feed/all/rss.xml", weight: 1.1 }
      - { name: "BFMTV", url: "https://www.bfmtv.com/rss/international/", weight: 1.0 }
      - { name: "Google News", url: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=fr&gl=FR&ceid=FR:fr", weight: 1.0, aggregator: true }
