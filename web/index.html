<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Médias</title>
<style>
:root{--bg:#0c0d12;--panel:#15161e;--panel2:#1c1d27;--line:#2a2b38;--txt:#ececf3;--mut:#9b9cad;--ok:#22c55e;--warn:#f5b301;--c:#6366f1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
a{color:inherit}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:8px 13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:#44465a}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
.btn.white{background:#fff;color:#000;border-color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn.on{background:#0f3b23;border-color:#1f7a45;color:#8ff0b5}
.btn.danger:hover{border-color:#a33;color:#ff8a8a}
header.top{position:sticky;top:0;z-index:20;background:rgba(12,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.2px}.logo span{color:var(--c)}
.hstat{color:var(--mut);font-size:13px;flex:1;min-width:200px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:5px;vertical-align:1px}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
nav.tabs{max-width:1240px;margin:0 auto;padding:0 18px 10px;display:flex;gap:8px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;font-weight:600}
.tab img{width:30px;height:30px;border-radius:8px}
.tab.active{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.tab .badge{background:var(--tc);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.tab.off{opacity:.45}
.spin{width:14px;height:14px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:1240px;margin:0 auto;padding:18px}
.mhead{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;flex-wrap:wrap}
.mhead img{width:64px;height:64px;border-radius:14px}
.mhead h1{margin:0;font-size:21px}.mhead .sub{color:var(--mut);font-size:13.5px}
.mhead .grow{flex:1;min-width:240px}
.status{font-size:13.5px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 12px}
.seg button.on{background:var(--panel2);color:#fff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:70px 20px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:18px 0;overflow:hidden}
.post.done{opacity:.6}
.phead{padding:14px 18px;border-bottom:1px solid var(--line)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mut)}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.chip.imp{background:var(--tc);border-color:var(--tc);color:#fff;font-weight:700}
.chip.warn{background:#3b2a00;border-color:#6b4d00;color:#ffd36b}
.chip.ok{background:#0f3320;border-color:#1f6b40;color:#8ff0b5}
.chip.fix{background:#2c2410;border-color:#6b5a1f;color:#ffe08a}
.chip.enq{background:#1d1640;border-color:#3e2f8f;color:#c9b8ff}
.chip.hot{background:#3d1206;border-color:#7a2a10;color:#ffb08a}
.chip.press{background:#10263d;border-color:#1f4a75;color:#9dc8ff}
.phead h2{margin:6px 0 0;font-size:18px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:0}
.col{padding:16px 18px}.col+.col{border-left:1px solid var(--line)}
.ctitle{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.slides{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.slides img{width:100%;border-radius:10px;display:block;aspect-ratio:4/5;object-fit:cover;background:#222}
.ximg{width:100%;border-radius:12px;display:block;margin-bottom:10px;aspect-ratio:16/9;object-fit:cover;background:#222}
textarea{width:100%;background:#0f1016;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:15px/1.5 "Segoe UI",system-ui,sans-serif;resize:vertical}
textarea.tw{min-height:118px}textarea.cap{min-height:190px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.count{font-size:12.5px;color:var(--mut)}.count.over{color:#ff6b6b;font-weight:700}
.pfoot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
.pfoot .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}.card p.help{color:var(--mut);margin:0 0 14px;font-size:13.5px}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input[type=text],input[type=password],input[type=number],select{background:#0f1016;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;width:100%;max-width:460px}
input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:8px;background:#0f1016;padding:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px}
.mrow{display:grid;grid-template-columns:44px 1.1fr 1fr 60px 2fr 70px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrow img{width:40px;height:40px;border-radius:9px}
.mrow input{max-width:none}
.log{font:12px/1.5 Consolas,monospace;color:var(--mut);background:#0f1016;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
.keyok{color:var(--ok)}.keyko{color:#ff7b7b}
@media (max-width:860px){.cols{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}.mrow{grid-template-columns:40px 1fr 1fr;}.mrow .wide{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo">⚡ Studio <span>Médias</span></div>
    <div class="hstat" id="hstat"></div>
    <button class="btn" id="genAll" title="Le studio génère tout seul ; ce bouton force une vérification immédiate">⟳ Vérifier l'actu maintenant</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, tab = localStorage.getItem('tab') || '', filter = localStorage.getItem('filter') || 'todo';
let posts = [], postsKey = '', timer = null;

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1700); }
async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
function wlen(t){ let n = 0; for (const ch of t) { const o = ch.codePointAt(0); n += (o <= 0x10FF || (o >= 0x2000 && o <= 0x201F)) ? 1 : 2; } return n; }
function copy(text){
  const done = () => toast('Copié ✓');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); done(); }
}
function newsAge(ts){ const m = Math.round((Date.now()/1000 - ts)/60); return m < 60 ? `d'il y a ${Math.max(1, m)} min` : `d'il y a ${Math.round(m/60)} h`; }
function verifChip(v){
  if (!v) return '';
  const tip = esc((v.problemes || []).join(' · ') || 'Aucune erreur trouvée');
  const n = (v.textes || []).length;
  if (v.verdict === 'ok') return `<span class="chip ok" title="${tip}">✅ Faits vérifiés sur ${n} article${n > 1 ? 's' : ''} complet${n > 1 ? 's' : ''}</span>`;
  if (v.verdict === 'corrige') return `<span class="chip fix" title="${tip}">✏️ Corrigé par la vérification (survole pour voir)</span>`;
  return `<span class="chip warn" title="${tip}">⚠️ Non vérifié sur les articles complets : relis bien</span>`;
}
function ago(ts){ if (!ts) return 'jamais'; const m = Math.round((Date.now()/1000 - ts)/60); return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.round(m/60)} h`; }

// ------------------------------------------------------------------ état
async function refresh(){
  try { S = await api('/api/state'); } catch(e) { $('#hstat').textContent = '⚠️ Studio injoignable : relance LANCER.bat'; schedule(5000); return; }
  if (!tab || (tab !== 'settings' && !S.medias.find(m => m.id === tab))) tab = S.settings.has_key ? S.medias[0].id : 'settings';
  renderHeader(); renderTabs(); updateTitle();
  if (tab === 'settings') { if (!$('#settingsView')) renderSettings(); else renderLog(); }
  else {
    const m = S.medias.find(x => x.id === tab);
    const key = tab + ':' + m.version;
    if (key !== postsKey || !$('#postsWrap')) { posts = await api('/api/posts?media=' + tab); postsKey = key; renderMedia(m, true); }
    else renderMedia(m, false);
  }
  schedule(S.busy ? 2500 : 15000);
}
function schedule(ms){ clearTimeout(timer); timer = setTimeout(refresh, ms); }

function renderHeader(){
  const st = S.settings;
  const auto = st.auto && st.has_key ? `<span class="dot live"></span>Automatique : l'actu est vérifiée toutes les ${st.check_every_min} min, posts créés dès qu'un sujet chauffe` : `<span class="dot"></span>Automatique : désactivé`;
  const key = st.has_key ? '' : ' · <b style="color:#ffd36b">Ajoute ta clé Gemini dans Réglages</b>';
  $('#hstat').innerHTML = `${auto} · IA : ${S.ai_calls} appel(s) aujourd'hui${key}`;
}
function renderTabs(){
  $('#tabs').innerHTML = S.medias.map(m => `
    <div class="tab ${m.id === tab ? 'active' : ''} ${m.enabled ? '' : 'off'}" style="--tc:${m.color}" data-tab="${m.id}">
      <img src="/brand/${m.id}.png?v=${encodeURIComponent(m.name + m.color)}" alt="">${esc(m.name)}
      ${m.status !== 'idle' ? '<span class="spin"></span>' : (m.todo ? `<span class="badge">${m.todo}</span>` : '')}
    </div>`).join('') + `<div class="tab ${tab === 'settings' ? 'active' : ''}" style="--tc:#6366f1" data-tab="settings">⚙️ Réglages</div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; localStorage.setItem('tab', tab); postsKey = ''; $('#main').innerHTML = ''; refresh(); }
});
$('#genAll').onclick = async () => { const r = await api('/api/generate', {media:'all'}); toast(r.started.length ? `Vérification lancée pour ${r.started.length} média(s)` : 'Déjà en cours'); refresh(); };
function updateTitle(){ const n = S.medias.reduce((a, m) => a + (m.enabled ? m.todo : 0), 0); document.title = (n ? `(${n}) ` : '') + 'Studio Médias'; }

// ------------------------------------------------------------------ média
function visible(p){
  if (filter === 'todo') return !p.hidden && !(p.posted_x && p.posted_social);
  if (filter === 'done') return p.posted_x || p.posted_social;
  return true;
}
function renderMedia(m, full){
  const busy = m.status !== 'idle';
  const statusTxt = busy ? `<span class="spin"></span> ${esc(m.msg || 'En cours…')}` : `${esc(m.msg || '')}${m.msg ? ' · ' : ''}Dernière vérification : ${ago(m.last)}`;
  if (!full && $('#mstatus')) { $('#mstatus').innerHTML = statusTxt; $('#genOne').disabled = busy; return; }
  const list = posts.filter(visible);
  $('#main').innerHTML = `
    <section class="mhead" style="--tc:${m.color}">
      <img src="/brand/${m.id}.png?v=${encodeURIComponent(m.name + m.color)}" alt="">
      <div class="grow"><h1>${esc(m.name)} <span class="sub">${esc(m.handle)}</span></h1>
        <div class="sub">${esc(m.niche)}</div>
        <div class="status" id="mstatus">${statusTxt}</div></div>
      <div class="tools">
        <div class="seg">${[['todo','À poster'],['done','Postés'],['all','Tout']].map(([k,l]) => `<button data-filter="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')}</div>
        <button class="btn" id="genOne" title="Force une génération même sans sujet chaud" ${busy ? 'disabled' : ''}>Forcer une génération</button>
        <button class="btn" id="enqOne" title="Dossier de fond vérifié sur l'affaire la plus suivie de la semaine" ${busy ? 'disabled' : ''}>🔎 Lancer une enquête</button>
      </div>
    </section>
    <div id="postsWrap">${list.length ? list.map(p => postHTML(p, m)).join('') :
      `<div class="empty">${posts.length ? 'Tout est posté 🎉 Les nouveaux sujets arriveront au prochain passage.' : (S.settings.has_key ? 'Aucun post pour l\'instant. Clique sur « Générer maintenant ».' : 'Commence par ajouter ta clé Gemini dans ⚙️ Réglages.')}</div>`}</div>`;
  $('#genOne').onclick = async () => { await api('/api/generate', {media: m.id}); toast('Génération lancée'); refresh(); };
  $('#enqOne').onclick = async () => { const r = await api('/api/enquete', {media: m.id}); toast(r.started ? 'Enquête lancée (2 à 4 min)' : 'Déjà en cours'); refresh(); };
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { filter = b.dataset.filter; localStorage.setItem('filter', filter); renderMedia(m, true); });
  bindPosts();
}
function postHTML(p, m){
  const n = wlen(p.x_text), done = p.hidden || (p.posted_x && p.posted_social);
  return `<article class="post ${done ? 'done' : ''}" data-id="${p.id}" style="--tc:${m.color}">
    <div class="phead">
      <div class="meta"><span class="chip imp">${p.importance}/10</span><span class="chip">${esc(p.label)}</span>
        <span class="chip">${p.n_sources} source${p.n_sources > 1 ? 's' : ''} : ${esc(p.sources.slice(0,4).join(', '))}</span>
        ${p.kind === 'enquete' ? '<span class="chip enq">🔎 Enquête</span>' : ''}${p.kind === 'recap' ? '<span class="chip enq">📰 L’essentiel du jour</span>' : ''}${verifChip(p.verif)}${p.hot ? '<span class="chip hot">🔥 Sujet chaud</span>' : ''}${p.sensitive ? '<span class="chip warn">⚠️ Sujet sensible : relis avant de publier</span>' : ''}${p.press ? `<span class="chip press" title="Aucune photo libre trouvée : c’est la photo de l’article. Les droits appartiennent au média ou à l’agence.">📰 Photo de l’article : droits non garantis</span>` : ''}<span>Info ${newsAge(p.news_time)} · prêt le ${p.time}</span></div>
      <h2>${esc(p.headline)}</h2>
    </div>
    <div class="cols">
      <div class="col">
        <div class="ctitle">📸 Instagram / TikTok · carrousel ${p.slides.length} images</div>
        <div class="slides">${p.slides.map((s, i) => `<a href="${s}" target="_blank" title="Image ${i+1}"><img loading="lazy" src="${s}" alt=""></a>`).join('')}</div>
        <div class="row"><a class="btn" href="${p.zip}?dl=1">⬇ Télécharger les ${p.slides.length} images (.zip)</a>
          ${p.slides.map((s, i) => `<a class="btn small" href="${s}&dl=1">${i+1}</a>`).join('')}</div>
        <textarea class="cap" data-k="cap">${esc(p.caption)}</textarea>
        <div class="row"><button data-act="copycap">Copier la description</button>${p.tiktok_text ? '<button data-act="copytt">Copier la légende TikTok</button>' : ''}
          ${p.tiktok_zip ? `<a class="btn" href="${p.tiktok_zip}?dl=1" title="Images en plein écran 9:16 pour TikTok">⬇ Version TikTok (.zip)</a>` : ''}</div>
      </div>
      <div class="col">
        <div class="ctitle">𝕏 X / Twitter · texte + image</div>
        <a href="${p.x_image}" target="_blank"><img class="ximg" loading="lazy" src="${p.x_image}" alt=""></a>
        <textarea class="tw" data-k="tw">${esc(p.x_text)}</textarea>
        <div class="row"><button data-act="copytw">Copier le tweet</button>
          <button class="btn white" data-act="openx">Ouvrir dans X</button>
          <a class="btn" href="${p.x_image}&dl=1">⬇ Image</a>
          <span class="count ${n > 280 ? 'over' : ''}" data-k="count">${n}/280</span></div>
        ${p.thread && p.thread.length ? `<details><summary>Fil complet : ${p.thread.length + 1} tweets</summary>
          <p class="sub" style="margin:0 0 8px">Publie le tweet ci-dessus avec l'image, puis réponds-y avec chacun de ceux-ci, dans l'ordre :</p>
          ${p.thread.map((t, i) => `<textarea class="tw thr" data-thr="${i}">${esc(t)}</textarea><div class="row"><button data-copythr="${i}">Copier le tweet ${i + 2}</button></div>`).join('')}</details>` : ''}
      </div>
    </div>
    <div class="pfoot">
      <button class="${p.posted_social ? 'on' : ''}" data-st="posted_social">✓ Posté Insta/TikTok</button>
      <button class="${p.posted_x ? 'on' : ''}" data-st="posted_x">✓ Posté sur X</button>
      <button class="${p.hidden ? 'on' : ''}" data-st="hidden">Ignorer</button>
      <span class="sp"></span>${p.can_rerender ? '<button data-act="rerender" title="Retente la recherche de photo et refait les images">🔄 Refaire les visuels</button>' : ''}
      <button class="danger" data-act="del">Supprimer</button>
    </div></article>`;
}
function bindPosts(){
  document.querySelectorAll('.post').forEach(el => {
    const id = +el.dataset.id, p = posts.find(x => x.id === id);
    const tw = el.querySelector('[data-k=tw]'), cap = el.querySelector('[data-k=cap]'), cnt = el.querySelector('[data-k=count]');
    tw.oninput = () => { const n = wlen(tw.value); cnt.textContent = n + '/280'; cnt.classList.toggle('over', n > 280); };
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const a = b.dataset.act;
      if (a === 'copytw') copy(tw.value);
      if (a === 'copycap') copy(cap.value);
      if (a === 'copytt') copy(p.tiktok_text);
      if (a === 'openx') window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(tw.value), '_blank');
      if (a === 'rerender') { b.disabled = true; b.innerHTML = '<span class="spin"></span> En cours…'; const r = await api(`/api/post/${id}/rerender`, {}); toast(r.ok ? 'Visuels refaits ✓' : 'Impossible pour ce post'); postsKey = ''; refresh(); }
      if (a === 'del' && confirm('Supprimer ce post ?')) { await api(`/api/post/${id}/delete`, {}); posts = posts.filter(x => x.id !== id); el.remove(); toast('Supprimé'); }
    });
    el.querySelectorAll('[data-copythr]').forEach(b => b.onclick = () => copy(el.querySelector(`[data-thr="${b.dataset.copythr}"]`).value));
    el.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
      const k = b.dataset.st; p[k] = !p[k];
      await api(`/api/post/${id}/status`, {[k]: p[k]});
      b.classList.toggle('on', p[k]);
      const done = p.hidden || (p.posted_x && p.posted_social);
      el.classList.toggle('done', done);
      if (done && filter === 'todo') { el.style.transition = '.3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }
      const m = S.medias.find(x => x.id === tab); if (m) { m.todo = posts.filter(x => !x.hidden && !(x.posted_x && x.posted_social)).length; renderTabs(); }
    });
  });
}

// ------------------------------------------------------------------ réglages
let BUFCH = null;
function chanOptions(sel, service){
  const list = (BUFCH || []).filter(c => !service || String(c.service).toLowerCase().includes(service));
  const same = c => c.ref === sel || (c.account === 1 && c.id === sel);
  const known = list.some(same);
  return '<option value="">—</option>' + (sel && !known ? `<option value="${esc(sel)}" selected>compte enregistré</option>` : '') +
    list.map(c => `<option value="${esc(c.ref)}" ${same(c) ? 'selected' : ''}>${esc(c.displayName || c.name)} · Buffer ${c.account}</option>`).join('');
}
function pubRow(m, cfg){
  const ko = t => `<span class="keyko">${t}</span>`, ok = t => `<span class="keyok">${t}</span>`;
  return `<div class="card" data-pub="${m.id}" style="padding:12px;margin:10px 0;background:var(--panel2)">
    <div class="row"><img src="/brand/${m.id}.png?v=${encodeURIComponent(m.name + m.color)}" style="width:34px;height:34px;border-radius:8px" alt="">
      <b style="flex:1">${esc(m.name)}</b><label><input type="checkbox" data-p="enabled" ${cfg.enabled ? 'checked' : ''}> publication auto</label></div>
    <div class="row" style="gap:16px;flex-wrap:wrap">

const RH = {x: {max: 20, gap: 15, n: '𝕏 X (chaque compte)'}, instagram: {max: 5, gap: 120, n: '📸 Instagram'}, tiktok: {max: 4, gap: 150, n: '🎵 TikTok'}, hub: {max: 30, gap: 12, n: '⭐ X « Gros Titre »'}};
function rhythmRows(cur){
  return Object.entries(RH).map(([k, d]) => { const c = (cur || {})[k] || {};
    return `<div class="mrow" style="grid-template-columns:200px 1fr 1fr"><b>${d.n}</b>
      <input type="number" min="1" max="60" data-rh="${k}" data-rk="max" value="${c.max || d.max}">
      <input type="number" min="5" max="600" step="5" data-rh="${k}" data-rk="gap" value="${c.gap || d.gap}"></div>`; }).join('');
}
function rhythmConfig(){
  const out = {};
  document.querySelectorAll('[data-rh]').forEach(i => { (out[i.dataset.rh] = out[i.dataset.rh] || {})[i.dataset.rk] = Math.max(1, +i.value || RH[i.dataset.rh][i.dataset.rk]); });
  return out;
}
function bufRow(m, cfg){
  return `<div class="mrow" data-buf="${m.id}" style="grid-template-columns:120px 1fr 1fr 1fr"><b>${esc(m.name)}</b>
    <select data-b="x">${chanOptions(cfg.x, 'twitter')}</select><select data-b="instagram">${chanOptions(cfg.instagram, 'instagram')}</select>
    <select data-b="tiktok">${chanOptions(cfg.tiktok, 'tiktok')}</select></div>`;
}

function pubConfig(){

}
